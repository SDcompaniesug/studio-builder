name: Studio Builder Android Build
on:
  repository_dispatch:
    types: [studio-build]
permissions:
  contents: read
  actions: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_URL: https://br-steep-leaf-b59uvinr-studiobuildapi.compute.c-7.us-east-2.aws.neon.tech
      BUILD_ID: ${{ github.event.client_payload.buildId }}
      PROJECT_ID: ${{ github.event.client_payload.projectId }}
      BUILD_TYPE: ${{ github.event.client_payload.buildType }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Register workflow run for live logs
        run: |
          jq -n --argjson runId "${{ github.run_id }}" --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{}' > /tmp/start.json
          curl --fail --silent --show-error -X POST "$API_URL/internal/builds/$BUILD_ID/start" -H "content-type: application/json" --data-binary @/tmp/start.json || true
      - name: Fetch generated Android project
        run: |
          curl --fail --silent --show-error "$API_URL/internal/projects/$PROJECT_ID/files" -o /tmp/project.json
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const data = JSON.parse(fs.readFileSync('/tmp/project.json', 'utf8'));
          if (!Array.isArray(data.files) || !data.files.length) throw new Error('No source files were returned');
          for (const file of data.files) {
            if (!file.path || file.path.startsWith('/') || file.path.includes('..') || file.path.includes('\\\\')) throw new Error('Unsafe source path');
            const target = path.resolve(process.cwd(), file.path);
            if (!target.startsWith(process.cwd() + path.sep)) throw new Error('Unsafe source path');
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, file.content, 'utf8');
          }
          NODE
      - name: Repair missing Android launcher icon resources
        run: |
          python3 <<'PY'
          import os, re, math, struct, zlib
          from pathlib import Path
          manifest = Path("app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("Generated project is missing app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")
          names = set(re.findall(r'@mipmap/([A-Za-z0-9_]+)', xml))
          if not names:
              names = {"ic_launcher"}
          def png(path):
              size = 192
              rows = []
              def inside(poly, x, y):
                  c = False
                  j = len(poly)-1
                  for i in range(len(poly)):
                      xi, yi = poly[i]; xj, yj = poly[j]
                      if ((yi > y) != (yj > y)) and x < (xj-xi)*(y-yi)/(yj-yi+1e-12)+xi:
                          c = not c
                      j = i
                  return c
              A = [(96,35),(148,155),(124,155),(113,126),(79,126),(68,155),(44,155)]
              hole = [(96,76),(105,106),(87,106)]
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      # Rounded blue app-icon tile with a white letter A.
                      edge = min(x,y,size-1-x,size-1-y)
                      corner_ok = True
                      if edge < 24:
                          cx = 24 if x < 24 else 167
                          cy = 24 if y < 24 else 167
                          corner_ok = (x-cx)**2 + (y-cy)**2 <= 24**2
                      if not corner_ok:
                          rgba = (0,0,0,0)
                      elif inside(A,x,y) and not inside(hole,x,y):
                          rgba = (255,255,255,255)
                      else:
                          rgba = (53,108,246,255)
                      row.extend(rgba)
                  rows.append(bytes(row))
              raw = b"".join(rows)
              def chunk(kind, data):
                  return struct.pack(">I",len(data))+kind+data+struct.pack(">I",zlib.crc32(kind+data)&0xffffffff)
              data = b"\x89PNG\r\n\x1a\n"
              data += chunk(b"IHDR",struct.pack(">2I5B",size,size,8,6,0,0,0))
              data += chunk(b"IDAT",zlib.compress(raw,9))+chunk(b"IEND",b"")
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          res = Path("app/src/main/res")
          for name in sorted(names):
              found = any(p.is_file() for p in res.glob("mipmap*/"+name+".*"))
              if not found:
                  target = res/"mipmap-mdpi"/(name+".png")
                  png(target)
                  print("Generated fallback launcher resource:", target)
          PY
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Android dependency repositories
        run: |
          cat > /tmp/studio-repositories.init.gradle <<'GRADLE'
          settingsEvaluated { settings ->
            settings.dependencyResolutionManagement.repositories {
              google()
              mavenCentral()
            }
          }
          gradle.beforeProject { project ->
            if (project.path == ':app') {
              project.plugins.withId('com.android.application') {
                project.dependencies.add('implementation', 'androidx.appcompat:appcompat:1.7.0')
                project.dependencies.add('implementation', 'androidx.core:core:1.15.0')
                project.configurations.configureEach { configuration ->
                  if (configuration.name.toLowerCase().contains('runtimeclasspath')) {
                    configuration.resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' &&
                          details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                        details.useTarget('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                        details.because('Use unified Kotlin stdlib to prevent duplicate JDK7/JDK8 classes')
                      }
                    }
                  }
                }
              }
            }
          }
          GRADLE
      - name: Compile APK
        id: compile
        shell: bash
        run: |
          set +e
          : > /tmp/build.log
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle --init-script /tmp/studio-repositories.init.gradle --no-daemon assembleRelease > /tmp/build.log 2>&1 &
          else
            gradle --init-script /tmp/studio-repositories.init.gradle --no-daemon assembleDebug > /tmp/build.log 2>&1 &
          fi
          GRADLE_PID=$!
          LAST_SIZE=0
          while kill -0 "$GRADLE_PID" 2>/dev/null; do
            SIZE=$(wc -c < /tmp/build.log)
            if [ "$SIZE" -gt "$LAST_SIZE" ]; then
              tail -c +$((LAST_SIZE + 1)) /tmp/build.log | curl --silent --show-error --max-time 15 -X POST "$API_URL/internal/builds/$BUILD_ID/logs" -H "content-type: text/plain" --data-binary @- >/dev/null || true
              LAST_SIZE=$SIZE
            fi
            sleep 2
          done
          wait "$GRADLE_PID"
          code=$?
          SIZE=$(wc -c < /tmp/build.log)
          if [ "$SIZE" -gt "$LAST_SIZE" ]; then
            tail -c +$((LAST_SIZE + 1)) /tmp/build.log | curl --silent --show-error --max-time 15 -X POST "$API_URL/internal/builds/$BUILD_ID/logs" -H "content-type: text/plain" --data-binary @- >/dev/null || true
          fi
          cat /tmp/build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Collect APK
        if: steps.compile.outputs.exit_code == '0'
        run: |
          mkdir -p output
          find . -path "*/build/outputs/apk/*/*.apk" -type f -exec cp {} output/ \;
          test -n "$(find output -name '*.apk' -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        if: steps.compile.outputs.exit_code == '0'
        with:
          name: studio-apk-${{ env.BUILD_ID }}
          path: output/*.apk
          retention-days: 7
      - name: Report result to Studio Builder
        if: always()
        env:
          EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$EXIT_CODE" = "0" ]; then STATUS=succeeded; else STATUS=failed; fi
          LOGS="$(tail -c 45000 /tmp/build.log 2>/dev/null || echo 'Build did not reach Gradle compilation.')"
          jq -n --arg status "$STATUS" --arg logs "$LOGS" --arg runUrl "$RUN_URL" --argjson runId "$RUN_ID" --arg error "$([ "$STATUS" = failed ] && echo 'Gradle build failed; open the Actions run for full logs.' || echo '')" '{status:$status,logs:$logs,runId:$runId,runUrl:$runUrl,error:$error}' > /tmp/result.json
          curl --fail --silent --show-error -X POST "$API_URL/internal/builds/$BUILD_ID/result" -H "content-type: application/json" --data-binary @/tmp/result.json || true
      - name: Fail workflow when Gradle failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
