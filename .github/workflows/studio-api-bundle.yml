name: Package Neon Function
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: neon-function-bundle
  cancel-in-progress: true
jobs:
  bundle:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Add generated Neon bundle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate uploaded HTML JavaScript
        run: |
          python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.S)
          inline = [item for item in scripts if item.strip()]
          if not inline:
              raise SystemExit("No inline JavaScript found in index.html")
          open("/tmp/studio-inline.js", "w", encoding="utf-8").write(inline[-1])
          PY
          node --check /tmp/studio-inline.js
      - name: Smoke test deployed Neon API
        continue-on-error: true
        run: |
          echo "API health:"
          curl --silent --show-error --max-time 20 "https://br-steep-leaf-b59uvinr-studiobuildapi.compute.c-7.us-east-2.aws.neon.tech/" || true
          echo
          echo "Database health:"
          curl --silent --show-error --max-time 20 -w "\\nHTTP=%{http_code}\\n" "https://br-steep-leaf-b59uvinr-studiobuildapi.compute.c-7.us-east-2.aws.neon.tech/health/db" || true
          echo
          echo "Project list endpoint:"
          curl --fail --silent --show-error --max-time 20 "https://br-steep-leaf-b59uvinr-studiobuildapi.compute.c-7.us-east-2.aws.neon.tech/projects" | tee /tmp/projects-health.json
          node -e "const x=require('/tmp/projects-health.json'); if(!Array.isArray(x.projects)) process.exit(1)"
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Bundle Neon Function
        run: |
          mkdir -p dist
          npx --yes esbuild backend/index.mjs --bundle --platform=node --format=esm --packages=bundle --banner:js='import { createRequire } from "node:module"; const require = createRequire(import.meta.url);' --outfile=dist/index.mjs
          cd dist
          zip -9 ../studiobuildapi.zip index.mjs
          cd ..
          base64 -w0 studiobuildapi.zip > studiobuildapi.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studiobuildapi.zip.b64
          git commit -m "Add generated Neon bundle"
          git pull --rebase origin main
          git push
      - name: Deploy Neon Function with GitHub integration token
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN }}
        run: |
          test -n "$NEON_API_KEY" || { echo "Missing NEON_API_KEY repository secret"; exit 1; }
          test -n "$STUDIO_GITHUB_TOKEN" || { echo "Missing STUDIO_GITHUB_TOKEN repository secret"; exit 1; }
          npm install --global neon
          neon link --project-id dry-fire-13288712 --branch-id br-steep-leaf-b59uvinr --no-env-pull
          neon functions deploy studiobuildapi --src dist/index.mjs --env "GITHUB_TOKEN=$STUDIO_GITHUB_TOKEN"
      - uses: actions/upload-artifact@v4
        with:
          name: neon-function-bundle
          path: studiobuildapi.zip
          retention-days: 2
